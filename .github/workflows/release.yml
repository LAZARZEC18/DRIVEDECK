name: Release APK

# Every push to main builds a signed APK and publishes it as a GitHub Release.
# Obtainium on the phone watches these releases and installs updates automatically.
on:
  push:
    branches: [ main ]
    paths: [ "app/**", "gradle/**", "*.gradle.kts" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Missing SIGNING_KEYSTORE_BASE64 secret" && exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/drivedeck-signing.keystore

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          NAME="1.1.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          ./gradlew assembleDebug -PdeckVersionCode=$CODE -PdeckVersionName=$NAME
          cp app/build/outputs/apk/debug/app-debug.apk "DRIVEDECK-v$NAME.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: DRIVEDECK v${{ env.VERSION_NAME }}
          body: ${{ github.event.head_commit.message }}
          files: DRIVEDECK-v${{ env.VERSION_NAME }}.apk
