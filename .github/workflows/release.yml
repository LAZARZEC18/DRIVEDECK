name: Release

# Every push to main:
#   1. runs the tests,
#   2. builds DRIVEDECK-vX.apk (the fast "direct" build, which Obtainium installs and updates) and,
#      once the upload key secrets exist, the Google Play bundle (.aab),
#   3. publishes them as a GitHub Release,
#   4. uploads the bundle to the Play internal testing track once PLAY_SERVICE_ACCOUNT_JSON is set,
#      so the phone gets the update from the Play Store automatically.
on:
  push:
    branches: [ main ]
    paths: [ "app/**", "gradle/**", "*.gradle.kts" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      UPLOAD_STORE_FILE: drivedeck-upload.jks
      UPLOAD_KEY_ALIAS: drivedeck-upload
      UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keys
        env:
          DEV_KEY_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          UPLOAD_KEY_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEV_KEY_B64" ]; then echo "Missing SIGNING_KEYSTORE_BASE64 secret" && exit 1; fi
          mkdir -p keystore
          echo "$DEV_KEY_B64" | base64 -d > keystore/drivedeck-signing.keystore
          # The Play bundle is only built once the upload key secrets are added.
          if [ -n "$UPLOAD_KEY_B64" ] && [ -n "$UPLOAD_STORE_PASSWORD" ]; then
            echo "$UPLOAD_KEY_B64" | base64 -d > keystore/drivedeck-upload.jks
            echo "HAS_UPLOAD_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::UPLOAD_KEYSTORE_BASE64 / UPLOAD_STORE_PASSWORD not set: skipping the Play bundle"
            echo "HAS_UPLOAD_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Build
        run: |
          CODE=$((300 + GITHUB_RUN_NUMBER))
          NAME="1.3.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          ./gradlew assembleDirect -PdeckVersionCode=$CODE -PdeckVersionName=$NAME
          cp app/build/outputs/apk/direct/app-direct.apk "DRIVEDECK-v$NAME.apk"
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            ./gradlew bundleRelease -PdeckVersionCode=$CODE -PdeckVersionName=$NAME
            cp app/build/outputs/bundle/release/app-release.aab "DRIVEDECK-v$NAME.aab"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: DRIVEDECK v${{ env.VERSION_NAME }}
          body: ${{ github.event.head_commit.message }}
          fail_on_unmatched_files: false
          files: |
            DRIVEDECK-v${{ env.VERSION_NAME }}.apk
            DRIVEDECK-v${{ env.VERSION_NAME }}.aab

      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY == 'true' && env.HAS_UPLOAD_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.lazarzec.drivedeck
          releaseFiles: DRIVEDECK-v${{ env.VERSION_NAME }}.aab
          track: internal
          status: completed
